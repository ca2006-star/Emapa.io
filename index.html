<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página Principal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom right, #d0f0ff, #a2d4f7);
      color: #013a63;
    }

    header {
      background: linear-gradient(to right, #0077b6, #48cae4);
      padding: 30px 20px;
      text-align: center;
      color: white;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    header h1 {
      font-size: 2.5em;
    }

    nav {
      display: flex;
      justify-content: center;
      background-color: #caf0f8;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    nav a {
      color: #0077b6;
      padding: 14px 20px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s ease, color 0.3s ease;
    }

    nav a:hover {
      background-color: #90e0ef;
      color: #03045e;
    }

    #fuente2 {
      text-align: center;
      font-weight: bold;
      font-size: 1.4em;
      margin-top: 30px;
      color: #023e8a;
    }

    img {
      display: block;
      margin: 20px auto;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .container {
      padding: 30px;
      max-width: 900px;
      margin: auto;
    }

    .main-content {
      background-color: #e0f7fa;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      transition: transform 0.3s ease;
    }

    .main-content:hover {
      transform: translateY(-5px);
    }

    #fuente1 {
      font-size: 1.6em;
      font-style: italic;
      color: #0077b6;
    }

    footer {
      background-color: #0077b6;
      color: white;
      text-align: center;
      padding: 20px;
      position: fixed;
      width: 100%;
      bottom: 0;
      font-size: 0.95em;
    }
  </style>
</head>
<body>

  <header>
    <h1>Bienvenidos a EMAPA</h1>
  </header>

  <p id="fuente2">ep-emapa-a</p>
  <img src="/imagenes/gota-agua.png" width="150" height="150" alt="Gota de Agua" />

  <nav>
    <a href="/PAGINAS/inicio.html" target="_top">CONÓCENOS</a>
    <a href="/PAGINAS/segunda.html" target="_top">SERVICIO</a>
    <a href="/PAGINAS/Contacto.html" target="_top">CONTACTO</a>
    <a href="/PAGINAS/giro.html" target="_top">FORTALEZAS</a>
  </nav>

  <div class="container">
    <div class="main-content">
      <p id="fuente1">"El agua es la fuerza motriz de toda la naturaleza"</p>
    </div>
  </div>
  <link rel="stylesheet" href="/PAGINAS/ema 1.css">
</head>
<body>
    <p id="fuente2">ep-emapa-a</p>
  <footer>
    <p>© 2025 Camila Buenaventura - EMAPA</p>
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Empresa de Agua</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --color-primario: #0288d1;
            --color-secundario: #e1f5fe;
            --color-fondo: #f0f8ff;
            --color-texto: #333;
            --sombra: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--color-fondo);
        }

        header {
            background-color: var(--color-primario);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: var(--sombra);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        nav {
            display: flex;
            justify-content: center;
            background-color: #039be5;
            gap: 20px;
            padding: 10px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 6px;
            transition: background 0.3s;
        }

        nav a:hover {
            background-color: #0277bd;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 40px 20px;
            gap: 30px;
        }

        .contact-form, .contact-info {
            flex: 1 1 350px;
            max-width: 450px;
            background-color: white;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: var(--sombra);
            transition: transform 0.3s ease;
        }

        .contact-form:hover, .contact-info:hover {
            transform: translateY(-5px);
        }

        .contact-form h2, .contact-info h3 {
            color: var(--color-primario);
            margin-bottom: 20px;
        }

        .contact-form label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
        }

        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .contact-form button {
            margin-top: 15px;
            background-color: var(--color-primario);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s ease;
        }

        .contact-form button:hover {
            background-color: #01579b;
        }

        .contact-info p {
            color: var(--color-texto);
            margin-bottom: 15px;
            font-size: 16px;
        }

        .contact-info i {
            margin-right: 8px;
            color: var(--color-primario);
        }

        #map {
            width: 100%;
            height: 400px;
            margin-top: 40px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--sombra);
        }

        footer {
            background-color: var(--color-primario);
            color: white;
            text-align: center;
            padding: 15px 10px;
            margin-top: 40px;
        }

        @media screen and (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: center;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Empresa Pública de Agua</h1>
    </header>

    <div class="container">
        <div class="contact-form">
            <h2>Contáctanos</h2>
            <form action="enviar_mensaje.php" method="POST">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Mensaje</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit"><i class="fas fa-paper-plane"></i> Enviar Mensaje</button>
            </form>
        </div>

        <div class="contact-info">
            <h3>Información de Contacto</h3>
            <p><i class="fas fa-map-marker-alt"></i> Antonio Clavijo & Manuel Isaías Sánchez, Ambato, Ecuador</p>
            <p><i class="fas fa-phone-alt"></i> 032997700 Ext. 701-702</p>
            <p><i class="fas fa-envelope"></i> contacto@empresaagua.com</p>
            <p><i class="fas fa-clock"></i> Lunes a Viernes 07:30 - 16:00</p>
        </div>
    </div>

    <div id="map">
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d997.7281097305074!2d-78.61979827116164!3d-1.2474393999999915!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x91d3811c64e361db%3A0x62291d1d3b11d20!2sEMAPA%20Ambato!5e0!3m2!1ses!2sec!4v1714400000000!5m2!1ses!2sec"
            width="100%"
            height="100%"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>
    <footer style="background-color: #0069c0; color: white; text-align: center; padding: 20px;">
        <p>© 2025Camila Buenaventura EMAPA</p>
        <a href="/index.html" style="display: inline-block; background-color: #ffffff; color: #0069c0; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: background 0.3s;">
            REGRESAR
        </a>
</body>
</html>
